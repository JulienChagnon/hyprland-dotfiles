general {
    before_sleep_cmd = hyprlock
    # dpms on, then rebuild waybar once outputs have settled (stale off-screen bar after resume)
    after_sleep_cmd  = hyprctl dispatch dpms on; ~/.local/bin/waybar-restart 3
    ignore_dbus_inhibit = false
}

# Lock screen at 14 minutes (skipped while SUPER+S "Auto sleep: OFF" is active, see idle-lock)
listener {
    timeout = 840
    on-timeout = ~/.local/bin/idle-lock
    on-resume  = hyprctl dispatch dpms on
}

# Suspend at 15 minutes
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
